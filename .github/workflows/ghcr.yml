name: GHCR

on:
  push:
    branches: [main, master, "feature/**", "bug/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/community-hub/communityhub.cloud:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record digest
        if: github.event_name == 'push' && steps.build.outputs.digest != ''
        run: |
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "image=ghcr.io/community-hub/communityhub.cloud@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
