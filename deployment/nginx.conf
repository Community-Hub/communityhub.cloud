server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    # Preserve meaningful WordPress sitemap links with flat static destinations.
    location = /home { return 301 /$is_args$args; }
    location = /home/ { return 301 /$is_args$args; }
    location = /products-and-services { return 301 /products.html$is_args$args; }
    location = /products-and-services/ { return 301 /products.html$is_args$args; }
    location = /environmental-dashboard { return 301 /environmental-dashboard.html$is_args$args; }
    location = /environmental-dashboard/ { return 301 /environmental-dashboard.html$is_args$args; }
    location = /team { return 301 /about.html$is_args$args; }
    location = /team/ { return 301 /about.html$is_args$args; }
    location = /products-and-services/data-manager { return 301 /the-hub.html$is_args$args; }
    location = /products-and-services/data-manager/ { return 301 /the-hub.html$is_args$args; }
    location = /products-and-services/dashboard-creator { return 301 /building-dashboard.html$is_args$args; }
    location = /products-and-services/dashboard-creator/ { return 301 /building-dashboard.html$is_args$args; }
    location = /products-and-services/citywide-dashboard { return 301 /citywide-dashboard.html$is_args$args; }
    location = /products-and-services/citywide-dashboard/ { return 301 /citywide-dashboard.html$is_args$args; }
    location = /products-and-services/community-calendar { return 301 /community-calendar.html$is_args$args; }
    location = /products-and-services/community-calendar/ { return 301 /community-calendar.html$is_args$args; }
    location = /products-and-services/community-voices { return 301 /community-voices.html$is_args$args; }
    location = /products-and-services/community-voices/ { return 301 /community-voices.html$is_args$args; }
    location = /products-and-services/digital-signage-software { return 301 /digital-signage.html$is_args$args; }
    location = /products-and-services/digital-signage-software/ { return 301 /digital-signage.html$is_args$args; }
    location = /products-and-services/story-maker { return 301 /stories.html$is_args$args; }
    location = /products-and-services/story-maker/ { return 301 /stories.html$is_args$args; }
    location = /pricing { return 301 /pricing.html$is_args$args; }
    location = /pricing/ { return 301 /pricing.html$is_args$args; }
    location = /contact-us { return 301 /contact.html$is_args$args; }
    location = /contact-us/ { return 301 /contact.html$is_args$args; }
    location = /products-and-services/phone-app { return 301 /phone-app.html$is_args$args; }
    location = /products-and-services/phone-app/ { return 301 /phone-app.html$is_args$args; }

    error_page 404 /404.html;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /404.html {
        add_header Cache-Control "no-store" always;
    }
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
